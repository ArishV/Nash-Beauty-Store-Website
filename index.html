    <script>
      const container = document.getElementById("logoPuzzle");
      const logoImg = container.querySelector("img");
      const wrapper = document.getElementById("logoWrapper");
      const src = logoImg.src;
    
      container.addEventListener("click", () => {
        container.classList.remove("idleBounce");
        logoImg.style.display = "none";
    
        // Reserve layout space
        wrapper.style.minHeight = "0px";
    
        const size = 75;
        const pieces = [];
    
        for (let y = 0; y < 4; y++) {
          for (let x = 0; x < 4; x++) {
            const piece = document.createElement("div");
            piece.classList.add("puzzle-piece");
            piece.style.width = `${size}px`;
            piece.style.height = `${size}px`;
            piece.style.left = `${x * size}px`;
            piece.style.top = `${y * size}px`;
            piece.style.backgroundImage = `url(${src})`;
            piece.style.backgroundPosition = `-${x * size}px -${y * size}px`;
            container.appendChild(piece);
            pieces.push(piece);
          }
        }
    
        // Shatter animation
        setTimeout(() => {
          pieces.forEach(piece => {
            const angle = Math.random() * 360;
            const x = (Math.random() - 0.5) * 500;
            const y = (Math.random() - 0.5) * 500;
            piece.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
            piece.style.opacity = 0;
          });
        }, 100);
    
        // Reform pieces
        setTimeout(() => {
          pieces.forEach(piece => {
            piece.style.transform = `translate(0, 0) rotate(0deg)`;
            piece.style.opacity = 1;
          });
        }, 1600);
    
        // Restore original logo and space
        setTimeout(() => {
          pieces.forEach(p => p.remove());
          logoImg.style.display = "block";
          container.classList.add("idleBounce");
          wrapper.style.minHeight = "300px"; // restores spacing instantly
        }, 2800);
      });
    </script>
