      <script>
        function setupCarousel(trackId) {
          const track = document.getElementById(trackId);
          const prevBtn = track.previousElementSibling;
          const nextBtn = track.nextElementSibling;
          const dotsContainer = document.getElementById(trackId.replace("carousel", "dots"));
          const slides = track.children;
          let index = 0;
      
          // Create dots
          for (let i = 0; i < slides.length; i++) {
            const dot = document.createElement("button");
            if (i === 0) dot.classList.add("active");
            dot.addEventListener("click", () => {
              index = i;
              updateCarousel();
            });
            dotsContainer.appendChild(dot);
          }
      
          const dots = dotsContainer.children;
      
          function updateCarousel() {
            track.style.transform = `translateX(-${index * 100}%)`;
            [...dots].forEach(dot => dot.classList.remove("active"));
            dots[index].classList.add("active");
          }
      
          nextBtn.addEventListener('click', () => {
            index = (index + 1) % slides.length; // wrap forward
            updateCarousel();
          });
      
          prevBtn.addEventListener('click', () => {
            index = (index - 1 + slides.length) % slides.length; // wrap backward
            updateCarousel();
          });
        }
      
        setupCarousel('hair-carousel');
        setupCarousel('skincare-carousel');
        setupCarousel('household-carousel');
        setupCarousel('school-carousel');
        setupCarousel('clothes-carousel');
        setupCarousel('personal-carousel');
        setupCarousel('food-carousel');
        setupCarousel('party-carousel');
        setupCarousel('scents-carousel');
        setupCarousel('pets-carousel');
        setupCarousel('babies-carousel');
        setupCarousel('accessories-carousel');
      </script>
